<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>CNTA E-file</title>
<meta name="description" content="Chloe Nguyen Tax Advisory e-file app demo: staff workspace and client portal (fictional data, IRS simulator).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: staff get a dense workbench (list → case with tabs); clients get a calm single-column portal with big tap targets.
   Shared language with IRS forms: boxed line numbers, ruled amount columns, ink stamps for IRS answers. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --ink: #14211d; --muted: #586964; --line: #d6dfdc; --soft: #e9efed;
  --accent: #0f5c4d; --accent-ink: #ffffff; --accent-soft: #dcefe9;
  --ok: #1e6b3a; --ok-soft: #e1f2e6; --bad: #b3261e; --bad-soft: #fbe6e4; --warn: #8a5a00; --warn-soft: #fbf0d9; --info: #1d4f91; --info-soft: #e3ecf8;
  --display: "Libre Franklin", "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #151d1a; --ink: #e3ebe8; --muted: #9aaba5; --line: #2b3834; --soft: #1c2622;
  --accent: #5ccfb0; --accent-ink: #06231c; --accent-soft: #173a31;
  --ok: #7fd69c; --ok-soft: #173826; --bad: #ff8a80; --bad-soft: #3d1b18; --warn: #f0c46a; --warn-soft: #3a2d10; --info: #8fb8ff; --info-soft: #172a45; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --ink: #e3ebe8; --muted: #9aaba5; --line: #2b3834; --soft: #1c2622;
  --accent: #5ccfb0; --accent-ink: #06231c; --accent-soft: #173a31;
  --ok: #7fd69c; --ok-soft: #173826; --bad: #ff8a80; --bad-soft: #3d1b18; --warn: #f0c46a; --warn-soft: #3a2d10; --info: #8fb8ff; --info-soft: #172a45; color-scheme: dark }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; }
a { color: var(--accent); }
code, .amt, .ln, time, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3, legend { font-family: var(--display); text-wrap: balance; }
h1 { font-size: clamp(22px, 3vw, 28px); margin: 4px 0; }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }

/* buttons */
.primary, .ghost, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r); padding: 9px 16px; cursor: pointer; font-weight: 600; text-decoration: none; min-height: 40px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
.ghost, .btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.ghost:hover { border-color: var(--accent); }
.btn.primary { color: var(--accent-ink); }
.primary:disabled, .ghost:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); text-decoration: underline; font-size: 14px; }
.link.danger { color: var(--bad); justify-self: start; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: end; margin-top: 14px; }

/* pills, banners */
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font: 600 12px var(--body); border: 1px solid currentColor; white-space: nowrap; vertical-align: middle; }
.t-ok { color: var(--ok); background: var(--ok-soft); } .t-bad { color: var(--bad); background: var(--bad-soft); }
.t-warn { color: var(--warn); background: var(--warn-soft); } .t-info { color: var(--info); background: var(--info-soft); }
.banner { border-radius: var(--r); padding: 10px 14px; border: 1px solid; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.banner.ok { color: var(--ok); background: var(--ok-soft); } .banner.bad { color: var(--bad); background: var(--bad-soft); }
.banner.warn { color: var(--warn); background: var(--warn-soft); } .banner.info { color: var(--info); background: var(--info-soft); }
.flash { border-radius: var(--r); padding: 10px 14px; margin: 0 0 12px; border: 1px solid; font-weight: 600; }
.flash-global { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; border-radius: var(--r); padding: 10px 16px; border: 1px solid; font-weight: 600; max-width: calc(100% - 32px); }
.spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* fields */
.form { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 14px; }
.sec { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; margin: 0; min-width: 0; display: grid; gap: 10px; background: var(--surface); }
legend { font-weight: 700; padding: 0 6px; font-size: 15px; }
.cnt { font: 500 12px var(--mono); color: var(--muted); background: var(--soft); border-radius: 999px; padding: 1px 8px; }
.grid { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; }
.fld { display: grid; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
.fld small { font-size: 12px; }
.fld input, .fld select { color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; width: 100%; font-size: 15px; min-height: 40px; }
.fld input[type=number] { font-family: var(--mono); text-align: right; }
.w-s { flex: 1 1 140px; max-width: 200px; } .w-m { flex: 2 1 200px; max-width: 320px; } .w-l { flex: 1 1 100%; }
.chk { display: flex; align-items: flex-start; gap: 8px; color: var(--ink); font-size: 14px; }
.chk input { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); flex: none; margin-top: 2px; }
.rowcard { border-left: 3px solid var(--line); padding: 6px 0 6px 12px; display: grid; gap: 6px; }
.subsec { margin: 6px 0 4px; padding: 10px 12px; background: var(--bg); border-radius: 8px; display: grid; gap: 8px; }
.subsec h4 { margin: 0; font-size: 13px; }
.rowcard.inner { border-left-color: var(--accent, var(--line)); }
fieldset:disabled .ghost, fieldset:disabled .link { display: none; }

/* staff shell */
.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.brand { display: flex; flex-direction: column; line-height: 1.1; text-decoration: none; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--accent); }
.brand span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.topnav { display: flex; gap: 14px; margin-right: auto; } .topnav a { text-decoration: none; font-weight: 600; color: var(--ink); }
.me { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.foot { max-width: 1320px; margin: 0 auto; padding: 0 16px 24px; font-size: 12px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.panel-head h2 { margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpis div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: grid; }
.kpis span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpis b { font: 600 22px var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; text-decoration: none; color: var(--ink); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tablewrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
table.list th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 8px; }
table.list td { border-bottom: 1px solid var(--line); padding: 8px; vertical-align: top; }
table.list tr[data-href] { cursor: pointer; } table.list tr[data-href]:hover td { background: var(--soft); }
table.list .num { text-align: right; } .pos { color: var(--ok); } .neg { color: var(--bad); }
table.list .sub { font-size: 12px; }

.casehead { display: grid; gap: 6px; }
.casehead .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.back { text-decoration: none; font-size: 14px; }
.flow { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: 4px 0 0; }
.flow li { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.flow li.done { color: var(--ok); border-color: var(--ok); } .flow li.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; }
.tabs a.on { color: var(--ink); border-color: var(--accent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

.split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.irsform { border: 1.5px solid var(--ink); border-radius: 2px; background: var(--surface); min-width: 0; }
.fhead { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; border-bottom: 1.5px solid var(--ink); padding: 6px 10px; font-size: 13px; }
.fno { font-family: var(--display); } .fno b { font-size: 22px; font-weight: 800; }
.omb { margin-left: auto; font: 500 12px var(--mono); color: var(--muted); }
.irsform table { width: 100%; border-collapse: collapse; font-size: 14px; }
.irsform td { border-bottom: 1px solid var(--line); padding: 5px 8px; }
td.ln { width: 46px; text-align: center; border-right: 1px solid var(--line); color: var(--muted); }
.irsform td.amt { width: 128px; text-align: right; border-left: 1px solid var(--ink); }
.irsform.f4562 { margin-top: 14px; }
.irsform th { text-align: left; font-size: 12px; font-weight: 600; padding: 5px 8px; border-bottom: 1px solid var(--ink); }
.irsform th.amt { text-align: right; }
.irsform .hint { font-size: 12px; color: var(--muted); }
tr.tot td { font-weight: 700; background: var(--soft); }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.findings li { border-left: 3px solid var(--line); padding: 4px 8px; background: var(--bg); border-radius: 0 4px 4px 0; }
.findings li.REJECT { border-color: var(--bad); } .findings li.WARN, .findings li.SCOPE { border-color: var(--warn); }
.findings .fix { color: var(--muted); }
.explain { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; }
.headline { margin: 0; font-weight: 600; }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.trace { font: 12.5px/1.5 var(--mono); padding-left: 22px; margin: 8px 0 0; color: var(--muted); }
pre.xml { max-height: 360px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 10px; font: 12px/1.45 var(--mono); white-space: pre; }
.gates { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
.gates li::before { content: "○ "; color: var(--muted); } .gates li.ok { color: var(--ok); } .gates li.ok::before { content: "✓ "; }
table.mini { border-collapse: collapse; font-size: 14px; width: 100%; } table.mini td { padding: 4px 0; border-bottom: 1px solid var(--line); } table.mini td.amt { text-align: right; }
.thread { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 8px; max-height: 420px; overflow: auto; }
.thread li { display: grid; max-width: 85%; }
.thread .bubble { padding: 8px 12px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); }
.thread li.client, .thread li.me { justify-self: end; } .thread li.client .bubble, .thread li.me .bubble { background: var(--accent-soft); }
.thread .by { font-size: 12px; color: var(--muted); padding: 2px 6px; }
.compose { display: flex; gap: 8px; } .compose input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--bg); min-height: 40px; }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 13px; }
.timeline time { color: var(--muted); }

.stamp { --c: var(--ok); color: var(--c); border: 4px double var(--c); border-radius: 8px; padding: 10px 20px; display: inline-grid; justify-items: center; transform: rotate(-5deg); margin: 10px 0 16px 8px; animation: stamp .35s ease-out both; max-width: 100%; }
.stamp.rej { --c: var(--bad); }
.stamp .s1 { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.stamp .s2 { font: 800 clamp(28px, 6vw, 42px)/1 var(--display); letter-spacing: .08em; }
.stamp .s3 { font: 500 11px var(--mono); }
@keyframes stamp { from { transform: rotate(-5deg) scale(1.4); opacity: 0; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }

/* login */
.login { max-width: 1100px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 18px; }
.lhead { display: grid; } .lhead b { font: 800 clamp(26px, 4vw, 36px) var(--display); color: var(--accent); } .lhead span { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; }
.lead { font-size: 17px; max-width: 62ch; margin: 0; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }
.who { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.who:hover { border-color: var(--accent); } .who b { font-size: 16px; } .who span { font-size: 13px; color: var(--muted); }
.signup { display: grid; gap: 10px; }

/* portal */
.portal { max-width: 860px; margin: 0 auto; padding: 0 16px 32px; }
.ptop { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.ptop .brand { margin-right: auto; } .ptop .brand b { font: 800 20px var(--display); color: var(--accent); } .ptop .brand span { font-size: 12px; }
.langs { display: flex; gap: 4px; flex-wrap: wrap; }
.langs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 14px; min-height: 36px; }
.langs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pmain { display: grid; gap: 14px; }
.tracker { list-style: none; padding: 0; margin: 6px 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 640px) { .tracker { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tracker li { display: grid; justify-items: center; text-align: center; gap: 4px; font-size: 12.5px; color: var(--muted); }
.tracker .dotn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font: 600 13px var(--mono); background: var(--surface); }
.tracker li.done { color: var(--ok); } .tracker li.done .dotn { border-color: var(--ok); background: var(--ok-soft); }
.tracker li.now { color: var(--ink); font-weight: 700; } .tracker li.now .dotn { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.pgrid { display: grid; gap: 14px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.todos { display: grid; gap: 8px; }
.todo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: var(--r); text-decoration: none; font-weight: 700; color: var(--accent); background: var(--accent-soft); min-height: 48px; }
.todo::after { content: "→"; }
.okline { color: var(--ok); font-weight: 600; margin: 8px 0 0; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 15px; }
table.ledger td { padding: 5px 0; border-bottom: 1px dotted var(--line); vertical-align: top; }
table.ledger td.amt { text-align: right; white-space: nowrap; padding-left: 12px; }
table.ledger .k-subtotal td, table.ledger .k-result td { font-weight: 700; border-bottom: 1px solid var(--ink); }
table.ledger .k-result td { color: var(--accent); font-size: 17px; }
table.ledger .hint { font-size: 12.5px; color: var(--muted); }
.consent { padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.signform { display: grid; gap: 12px; margin-top: 14px; }
.err { color: var(--bad); font-weight: 600; margin: 0; }
.big { font: 700 34px var(--mono); margin: 0 0 12px; }
.demo-note { font-size: 12px; color: var(--muted); margin-top: 24px; }
@media (max-width: 520px) {
  .stamp { padding: 8px 12px; margin: 8px auto 14px; justify-self: center; }
  .stamp .s2 { font-size: 24px; }
  .stamp .s1 { letter-spacing: .06em; font-size: 10px; }
  .stamp .s2 { letter-spacing: .03em; }
}
.pmain, .panel { overflow-x: clip; }
@media (prefers-reduced-motion: reduce) { .stamp, .spinner { animation: none; } }

/* ---- documents ---- */
.doclist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.docrow { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; flex-wrap: wrap; }
.docrow.staff { align-items: flex-start; }
.docact { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.docitem { display: flex; gap: 12px; margin-top: 8px; align-items: flex-start; flex-wrap: wrap; }
.docprev { width: 96px; min-height: 64px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; overflow: hidden; font-size: 12px; background: var(--soft); }
.docprev img { width: 96px; height: auto; display: block; }
.docbtns { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 6px; }
.dstate { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
.dstate.ok { color: var(--ok, #1a7f37); } .dstate.bad { color: var(--bad, #b42318); } .dstate.info { color: var(--ink); }
.btn.small, button.small { padding: 4px 10px; font-size: 13px; }
input.upl:focus-visible + label { outline: 3px solid var(--accent, #0b6b58); outline-offset: 2px; }

/* ---- client copy / PDF ---- */
.printlink { margin-left: 8px; vertical-align: middle; }
.printbar { max-width: 860px; margin: 16px auto 0; padding: 0 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.printdoc { position: relative; max-width: 860px; margin: 16px auto 40px; padding: 28px 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.printdoc .ph { display: flex; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.printdoc .firm { font-weight: 700; font-size: 18px; }
.printdoc .pright { text-align: right; }
.printdoc .sub { color: var(--muted); font-size: 13px; }
.printdoc .pblock { margin: 16px 0; break-inside: avoid; }
.printdoc .forms .irsform { break-inside: avoid; }
.printdoc table.kv { border-collapse: collapse; width: 100%; font-size: 14px; }
.printdoc table.kv th { text-align: left; width: 140px; color: var(--muted); font-weight: 600; padding: 4px 8px 4px 0; vertical-align: top; }
.printdoc table.kv td { padding: 4px 0; }
.printdoc .plain { background: var(--soft); padding: 10px 12px; border-radius: 6px; }
.printdoc h3 { font-size: 15px; margin: 0 0 6px; }
.draftmark { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-24deg); font-size: 120px; font-weight: 800; color: var(--ink); opacity: .06; pointer-events: none; }
@media (max-width: 600px) { .printdoc { padding: 18px 14px; } }
@page { size: letter; margin: 0.6in; }
@media print {
  body { background: #fff !important; color: #000 !important; }
  .noprint, header.top, footer.foot, .flash-global { display: none !important; }
  .printdoc { border: 0; margin: 0; padding: 0; max-width: none; }
  .irsform { border-color: #000 !important; }
  a[href]::after { content: none !important; }
}
